[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reply-lecture-transcription"
version = "0.1.0"
description = "Timestamped English/Italian lecture transcription for a multimodal RAG pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openai-whisper==20250625"]

[project.scripts]
lecture-transcribe = "lecture_transcription.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
