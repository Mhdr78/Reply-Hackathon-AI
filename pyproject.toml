[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reply-lecture-transcription"
version = "0.2.0"
description = "Timestamped lecture transcription and aligned English/Italian transcript translation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openai-whisper==20250625", "python-dotenv>=1.1,<2"]

[project.scripts]
lecture-transcribe = "lecture_transcription.cli:main"
lecture-translate = "lecture_translation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
